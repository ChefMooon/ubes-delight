architectury {
    common(rootProject.enabled_platforms.split(","))
}

//loom {
//    accessWidenerPath = file("src/main/resources/ubesdelight.accesswidener")
//}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    //modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // FD Refabricated
    implementation ("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }

//    compileOnly("me.shedaniel:RoughlyEnoughItems-api:$rei_version")
//    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version")

//    compileOnly("dev.emi:emi-xplat-intermediary:${emi_version}:api") {
//        transitive = false
//        exclude(group: "net.fabricmc.fabric-api")
//    }

    compileOnly("mcp.mobius.waila:wthit-api:fabric-${wthitVersion}")

}

sourceSets.main {
    resources { // include generated resources in resources
        srcDir("src/generated/resources")
        exclude("src/generated/resources/.cache")
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
