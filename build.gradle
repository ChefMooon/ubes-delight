plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "2.0.0-beta.1"
}

base {
    archivesName = "UbesDelight"
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
            options.compilerArgs << "-Xmaxwarns" << "1000"
        }
    }
}

fabricApi {
    configureDataGeneration {
        outputDirectory = file("src/generated/resources")
        strictValidation = false
        createSourceSet = true
        modId = project.mod_id
    }
}

loom {
    accessWidenerPath = file("src/main/resources/ubesdelight.classtweaker")
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url "https://maven.parchmentmc.org" } // Parchment mappings

    maven { url 'https://maven.neoforged.net/releases' } // NeoForge

    maven { // Farmers Delight Refabricated
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }
    maven { url "https://mvn.devos.one/snapshots/" } // Registrate, Porting Lib, Forge Tags, Milk Lib
    maven { url "https://mvn.devos.one/releases/" } // Porting Lib
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes (Required by Porting Lib)
        content { includeGroup "com.jamieswhiteshirt" }
    }
    maven {
        url "https://jitpack.io/" // Fabric ASM
    }

    maven { url 'https://www.cursemaven.com' } // Farmers Delight

    maven { url "https://maven.ryanliptak.com/" } // Appleskin

    maven { url "https://maven.blamejared.com/" } // JEI
    maven { url "https://maven.shedaniel.me" } // REI
    maven { url "https://maven.terraformersmc.com/" } // EMI

    maven { url "https://api.modrinth.com/maven" } // MidnightLib

    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
            includeGroup "mcp.mobius.waila"
        }
    }
    mavenCentral() // Mixin Extras
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    mappings loom.layered() {
        it.officialMojangMappings {
            setNameSyntheticMembers(false)
        }
        it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}")
    }

    modCompileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    modCompileOnly("dev.architectury:architectury-fabric:13.0.6")

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

//    modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-fabric-${minecraft_version}:${crafttweaker_version}")

    dependencies {
        modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
            exclude(group: "net.fabricmc")
        }
    }

    // MidnightLib
    modImplementation include("maven.modrinth:midnightlib:${project.midnightlib_fabric_version}")

    // ModMenu
    modLocalRuntime("com.terraformersmc:modmenu:${mod_menu_version}")

    // Recipe Viewers
    // EMI
    modCompileOnly("dev.emi:emi-fabric:$emi_version:api") {
        transitive = false
        exclude(group: "net.fabricmc.fabric-api")
    }
    // JEI
    modCompileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version") { transitive = false }
    modCompileOnly("mezz.jei:jei-$minecraft_version-fabric-api:$jei_version") { transitive = false }
    // REI
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version")

    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "jei": modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"); break
        case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"); break
        case "emi": modLocalRuntime("dev.emi:emi-fabric:${emi_version}"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: ${recipe_viewer}. Must be JEI, REI, EMI, or disabled.")
    }

    // compile against the API
    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${wthitVersion}"

    // run against the full jar
    modRuntimeOnly "mcp.mobius.waila:wthit:fabric-${wthitVersion}"
    modRuntimeOnly "lol.bai:badpackets:fabric-${badpacketsVersion}"
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,

            mod_id               : project.mod_id,
            mod_name             : project.mod_name,
            mod_version          : project.mod_version,
            mod_license          : project.mod_license,
            mod_authors          : project.mod_authors,
            mod_description      : project.mod_description,
            mod_credits          : project.mod_credits,
            mod_homepage         : project.mod_homepage,
            mod_github           : project.mod_github,
            mod_issues           : project.mod_issues,
            mod_discord          : project.mod_discord
    ]

    inputs.properties replaceProperties

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

// configure the maven publication
// requires plugin id 'maven-publish', uncomment if needed
//publishing {
//    publications {
//        mavenJava(MavenPublication) {
//            groupId project.group
//            artifactId project.base.archivesName.get()
//            version project.version
//            from components.java
//        }
//    }
//}

def buildSuffix = mod_version_type != "STABLE" ? "-${mod_version_type}" + (mod_build_number != "0" ? "-${mod_build_number}" : "") : ""
version = "${project.name}-${minecraft_version}-${mod_version}${buildSuffix}" + "-3.0.0+refab"

var changelogFile = rootProject.file("changelog.md")
var changelogText = changelogFile.exists() ? changelogFile.text : ""
var vName = mod_name + " " + project.version

publishMods {
    file = remapJar.archiveFile
    changelog = changelogText
    version = project.version
    type = me.modmuss50.mpp.ReleaseType.valueOf(mod_version_type)
    displayName = vName

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge("curseforgeFabric") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))
        javaVersions.add(JavaVersion.VERSION_21)

        clientRequired = true
        serverRequired = true

        requires("fabric-api")
        requires("farmers-delight-refabricated")
        embeds("midnightlib")
        optional("modmenu")
        optional("jei")
        optional("roughly-enough-items")
        optional("emi")
    }

    modrinth("modrinthFabric") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))

        requires("fabric-api")
        requires("farmers-delight-refabricated")
        embeds("midnightlib")
        optional("modmenu")
        optional("jei")
        optional("rei")
        optional("emi")
    }
}