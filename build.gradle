plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    id "me.modmuss50.mod-publish-plugin" version "2.0.0-beta.1"
}

base {
    archivesName = 'ubesdelight'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def buildSuffix = mod_version_type != "STABLE" ? "-${mod_version_type}" + (mod_build_number != "0" ? "-${mod_build_number}" : "") : ""

version = "neoforge-${minecraft_version}-${mod_version}${buildSuffix}"
group = "${maven_group}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html

repositories {
    maven { url "https://maven.parchmentmc.org" } // Parchment mappings

    maven { url 'https://maven.neoforged.net/releases' } // NeoForge

    maven { url 'https://maven.greenhouse.lgbt/releases/' } // Farmers Delight Refabricated
    maven { url "https://mvn.devos.one/snapshots/" } // Registrate, Porting Lib, Forge Tags, Milk Lib
    maven { url "https://mvn.devos.one/releases/" } // Porting Lib
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes (Required by Porting Lib)
        content { includeGroup "com.jamieswhiteshirt" }
    }
    maven {
        url "https://jitpack.io/" // Fabric ASM
    }

    maven { url 'https://www.cursemaven.com' } // Farmers Delight

    maven { url "https://maven.ryanliptak.com/" } // Appleskin

    maven { url "https://maven.blamejared.com/" } // JEI
    maven { url "https://maven.shedaniel.me" } // REI
    maven { url "https://maven.terraformersmc.com/" } // EMI

    maven { url "https://api.modrinth.com/maven" } // MidnightLib

    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
            includeGroup "mcp.mobius.waila"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
//            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    exclude(".cache")
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Farmers Delight
    implementation "curse.maven:farmers-delight-398521:${farmersdelight_version}"
    localRuntime "curse.maven:farmers-delight-398521:${farmersdelight_version}"

    // MidnightLib
    implementation "maven.modrinth:midnightlib:${project.midnightlib_neoforge_version}"

    // Appleskin
    //modCompileOnly("squeek.appleskin:appleskin-forge:${appleskin_forge_version}:api")
    //modRuntimeOnly("squeek.appleskin:appleskin-forge:${appleskin_forge_version}")

    // Recipe Viewers
    // EMI
    compileOnly("dev.emi:emi-neoforge:$emi_version:api") { transitive = false }
    // JEI
    compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version") { transitive = false }
    compileOnly("mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version") { transitive = false }
    // REI
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:$rei_version")
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    compileOnly("dev.architectury:architectury-fabric:13.0.6")

    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "jei": localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"); break
        case "rei": localRuntime("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"); break
        case "emi": localRuntime("dev.emi:emi-neoforge:${emi_version}"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: ${recipe_viewer}. Must be JEI, REI, EMI, or disabled.")
    }

    // compile against the API
    compileOnly("mcp.mobius.waila:wthit-api:neo-${wthitVersion}")

    // run against the full jar
    localRuntime("mcp.mobius.waila:wthit:neo-${wthitVersion}")
    localRuntime("lol.bai:badpackets:neo-${badpacketsVersion}")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,

            mod_id               : project.mod_id,
            mod_name             : project.mod_name,
            mod_version          : project.mod_version,
            mod_license          : project.mod_license,
            mod_authors          : project.mod_authors,
            mod_description      : project.mod_description,
            mod_credits          : project.mod_credits,
            mod_homepage         : project.mod_homepage,
            mod_github           : project.mod_github,
            mod_issues           : project.mod_issues,
            mod_discord          : project.mod_discord
    ]

    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

var changelogFile = rootProject.file("changelog.md")
var changelogText = changelogFile.exists() ? changelogFile.text : ""
var vName = mod_name + " " + project.version

publishMods {
    dryRun = true
    file = jar.archiveFile
    changelog = changelogText
    version = project.version
    type = me.modmuss50.mpp.ReleaseType.valueOf(mod_version_type)
    displayName = vName

    modLoaders.add("neoforge")

    curseforge("curseforgeNeoforge") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))
        javaVersions.add(JavaVersion.VERSION_21)

        clientRequired = true
        serverRequired = true

        requires("farmers-delight")
        embeds("midnightlib")
        optional("jei")
        optional("roughly-enough-items")
        optional("emi")
    }

    modrinth("modrinthNeoforge") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))

        requires("farmers-delight")
        embeds("midnightlib")
        optional("jei")
        optional("rei")
        optional("emi")
    }
}