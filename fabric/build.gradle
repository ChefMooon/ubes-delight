plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    Project common = project(":common")
//    accessWidenerPath = common.loom.accessWidenerPath

    runs {
        datagen {
            client()

            name "Minecraft Data"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${common.file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${archives_base_name}"
            programArgs "--existing", file("src/main/resources").absolutePath

            environmentVariable("DATAGEN", "TRUE")
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    api "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // FD Refabricated
    implementation ("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }

    // MidnightLib
    implementation include("maven.modrinth:midnightlib:${project.midnightlib_fabric_version}")

    // ModMenu
    localRuntime("com.terraformersmc:modmenu:${mod_menu_version}")

    // Recipe Viewers
    // EMI
//    compileOnly("dev.emi:emi-fabric:$emi_version:api") {
//        transitive = false
//        exclude(group: "net.fabricmc.fabric-api")
//    }
    // JEI
//    compileOnly("mezz.jei:jei-$minecraft_version-common-api:$jei_version") { transitive = false }
//    compileOnly("mezz.jei:jei-$minecraft_version-fabric-api:$jei_version") { transitive = false }
    // REI
//    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version") { transitive = false }
//    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version")

    // RRV
    compileOnly("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "eu.pb4")
    }

    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
//        case "jei": localRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"); break
//        case "rei": localRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"); break
//        case "emi": localRuntime("dev.emi:emi-fabric:${emi_version}"); break
        case "rrv": localRuntime("maven.modrinth:rrv:${rrv_version}-fabric") {exclude(group: "net.fabricmc.fabric-api")}; break
        case "disabled": break
        default: println("Unknown recipe viewer specified: ${recipe_viewer}. Must be JEI, REI, EMI, RRV, or disabled.")
    }

    // compile against the API
    compileOnly "mcp.mobius.waila:wthit-api:fabric-${wthitVersion}"

    // run against the full jar
    runtimeOnly "mcp.mobius.waila:wthit:fabric-${wthitVersion}"
    runtimeOnly "lol.bai:badpackets:fabric-${badpacketsVersion}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    // Integration Testing
    // Fabric Seasons
    //modLocalRuntime("maven.modrinth:fabric-seasons:2.3+1.20")
    //modLocalRuntime("maven.modrinth:fabric-seasons-delight-compat:1.0")
}

processResources {
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE.md")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

def buildSuffix = mod_version_type != "STABLE" ? "-${mod_version_type}" + (mod_build_number != "0" ? "-${mod_build_number}" : "") : ""
version = "${project.name}-${minecraft_version}-${mod_version}${buildSuffix}"

var changelogFile = rootProject.file("changelog.md")
var changelogText = changelogFile.exists() ? changelogFile.text : ""
var vName = mod_name + " " + project.version

publishMods {
    file = shadowJar.archiveFile
    changelog = changelogText
    version = project.version
    type = mod_version_type
    displayName = vName

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge("curseforgeFabric") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))
        javaVersions.add(JavaVersion.VERSION_21)

        clientRequired = true
        serverRequired = true

        requires("fabric-api")
        requires("farmers-delight-refabricated")
        embeds("midnightlib")
        optional("modmenu")
        optional("jei")
        optional("roughly-enough-items")
//        optional("emi")
        optional("rrv")
    }

    modrinth("modrinthFabric") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))

        requires("fabric-api")
        requires("farmers-delight-refabricated")
        embeds("midnightlib")
        optional("modmenu")
        optional("jei")
        optional("rei")
//        optional("emi")
        optional("rrv")
    }
}